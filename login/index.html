<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ingresar · 360Preventa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="/assets/brand/360preventa-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel_gestion/css/base.css?v=panel75">
<link rel="stylesheet" href="/panel_gestion/css/patches.css?v=panel75">
<style>
  /* Puerta de acceso minimal: marca + dos destinos */
  .login-card .login-wordmark{margin-bottom:0}
  .login-gate-actions{display:grid;gap:12px;margin-top:36px;text-align:left}
  .login-gate-actions .login-submit{margin-top:0;text-decoration:none;display:block;box-sizing:border-box}
  .login-gate-back{
    display:inline-block;margin-top:28px;color:#666;text-decoration:none;
    font:500 11px/1 Manrope,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase
  }
  .login-gate-back:hover{color:#bbb}
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
 <div class="login-card">
  <a class="login-home-logo mag" href="/" aria-label="Volver a 360Preventa" data-cursor="INICIO">
   <img src="/panel_gestion/assets/logo.png" alt="360Preventa">
  </a>
  <h1 class="login-wordmark">BOXIES</h1>
  <div class="login-gate-actions">
   <a class="login-submit mag" href="/miperfil/" data-cursor="CLIENTE">Cliente</a>
   <a class="login-submit mag" href="/panel_gestion/" data-cursor="EQUIPO">Equipo</a>
  </div>
  <a class="login-gate-back" href="/">← Inicio</a>
 </div>
</section>
</body>
</html>

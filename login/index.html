<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ingresar · 360Preventa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="/assets/brand/360preventa-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel_gestion/css/base.css?v=panel73">
<link rel="stylesheet" href="/panel_gestion/css/patches.css?v=panel73">
<style>
  /* Puerta de acceso: misma card BOXIES; dos destinos separados */
  .login-gate-actions{display:grid;gap:12px;margin-top:8px;text-align:left}
  .login-gate-actions .login-submit{margin-top:0;text-decoration:none;display:block;box-sizing:border-box}
  .login-gate-hint{
    margin:18px 0 0;color:#666;font:500 12px/1.45 Manrope,Arial,sans-serif;text-align:center
  }
  .login-gate-back{
    display:inline-block;margin-top:18px;color:#777;text-decoration:none;
    font:500 12px/1 Manrope,Arial,sans-serif;letter-spacing:.04em
  }
  .login-gate-back:hover{color:#bbb}
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
 <div class="login-card">
  <a class="login-home-logo mag" href="/" aria-label="Volver a 360Preventa" data-cursor="INICIO">
   <img src="/panel_gestion/assets/logo.png" alt="360Preventa">
  </a>
  <h1 class="login-wordmark">BOXIES</h1>
  <p class="login-subtitle"><strong>360PREVENTA</strong> · ACCESO</p>
  <div class="login-gate-actions">
   <a class="login-submit mag" href="/miperfil/" data-cursor="CLIENTE">Soy cliente · Mi perfil</a>
   <a class="login-submit mag" href="/panel_gestion/" data-cursor="EQUIPO">Soy equipo · Panel de gestión</a>
  </div>
  <p class="login-gate-hint">Elige cómo quieres entrar. Las cuentas no se mezclan.</p>
  <a class="login-gate-back" href="/">← Volver al inicio</a>
 </div>
</section>
</body>
</html>

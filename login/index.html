<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login — 360Preventa</title>
  <meta name="theme-color" content="#050505">
  <meta name="app-version" content="V5.9.36">
  <link rel="icon" type="image/png" href="/assets/brand/360preventa-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: #080808;
      --fg: rgba(255, 255, 255, 0.88);
      --muted: rgba(255, 255, 255, 0.42);
      --line: rgba(255, 255, 255, 0.1);
      --line-hover: rgba(255, 255, 255, 0.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Outfit, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    .card {
      width: min(22rem, 100%);
      padding: 2.75rem 2rem 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .mark {
      width: 64px;
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }
    .brand {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      font-weight: 550;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--fg);
      margin-right: -0.42em;
    }
    .lead {
      margin: 0 0 2rem;
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--muted);
    }
    .enter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.85rem 1.15rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: transparent;
      color: #fff;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .enter:hover {
      border-color: var(--line-hover);
      background: rgba(255, 255, 255, 0.03);
    }
    .enter__arrow {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
      opacity: 0.78;
    }
    .back {
      display: inline-block;
      margin-top: 1.15rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      transition: color 0.25s ease;
    }
    .back:hover { color: rgba(255, 255, 255, 0.62); }

    @media (max-width: 480px) {
      body { padding: 1.1rem 1rem max(1.1rem, env(safe-area-inset-bottom)); }
      .card {
        padding: 2.15rem 1.35rem 1.65rem;
        border-radius: 14px;
      }
      .mark { width: 56px; margin-bottom: 1.25rem; }
      .brand { font-size: 1.2rem; }
      .lead { margin-bottom: 1.6rem; font-size: 0.84rem; }
      .enter { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>
  <!-- V5.9.36 PRE-LOGIN — puerta a /boxies (login real intacto) -->
  <div class="card">
    <img class="mark" src="/assets/brand/360preventa-mark.png" alt="360Preventa" width="64" height="73">
    <div class="brand" aria-label="BOXIES">B O X I E S</div>
    <p class="lead">Acceso para administradores y constructoras.</p>
    <a class="enter" href="/boxies">
      <span>Entrar</span>
      <span class="enter__arrow" aria-hidden="true">→</span>
    </a>
    <a class="back" href="/">Volver al inicio</a>
  </div>
</body>
</html>

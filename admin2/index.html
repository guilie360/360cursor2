<!DOCTYPE html>
<html lang="es" class="theme-ready">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOXIES | Dashboard Global</title>
  <!-- HALL tokens + official Builder shell CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hall/hall.css">
  <link rel="stylesheet" href="../admin/css/admin-auth.css">
  <link rel="stylesheet" href="../admin/css/ai-project-builder.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body class="bx-admin2">

  <!-- Login (outside app shell) -->
  <div id="bxLoginView" class="hall-login-page" hidden>
    <div class="content-modal-box auth-experience-box">
      <div class="hall-login-brand">BOXIES</div>
      <h2 class="auth-gate-title">Dashboard Global</h2>
      <p class="auth-view-lead">Entra con la misma cuenta de administrador del showroom.</p>

      <div class="auth-oauth-row">
        <button type="button" class="outline-btn auth-oauth-btn" id="bxGoogleBtn">Google</button>
      </div>
      <div class="auth-oauth-divider" aria-hidden="true">o continúa con tu correo</div>

      <form id="bxLoginForm" class="auth-modal-form" novalidate>
        <label class="auth-field">
          <span>Correo electrónico</span>
          <input id="bxEmail" type="email" autocomplete="email" placeholder="correo@empresa.com" required>
        </label>
        <label class="auth-field">
          <span>Contraseña</span>
          <input id="bxPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="auth-toggle-password" id="bxTogglePassword">Mostrar</button>
        </label>
        <label class="auth-remember-row">
          <input id="bxRemember" type="checkbox" checked>
          <span>Recordarme en este dispositivo</span>
        </label>
        <button type="submit" class="outline-btn auth-action-btn" id="bxLoginSubmit">
          <span id="bxLoginSubmitText">Iniciar sesión</span>
        </button>
      </form>

      <div class="auth-modal-message" id="bxLoginMessage" role="alert"></div>
    </div>
  </div>

  <div id="bxForbiddenView" class="hall-login-page" hidden>
    <div class="panel-card" style="width:min(460px,100%);text-align:center">
      <h1 class="panel-card-title">Acceso denegado</h1>
      <p class="placeholder-copy">Tu cuenta está autenticada, pero no tiene rol de administrador en BOXIES.</p>
      <button type="button" class="builder-header-action-btn" id="bxForbiddenLogout">Cerrar sesión</button>
    </div>
  </div>

  <!--
    Official BOXIES App Shell (same DOM as Builder).
    Only #builderStepPanel content changes per module.
  -->
  <div id="bxAppView" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/shared/config.js"></script>
  <script src="../js/shared/constants.js"></script>
  <script src="../js/theme-system.js"></script>
  <script src="../js/platform/hall-design-system.js"></script>
  <script>
    try {
      if (typeof HallDesignSystem !== 'undefined') HallDesignSystem.paint({ persist: false });
      else document.documentElement.classList.add('theme-ready');
    } catch (e) {
      document.documentElement.classList.add('theme-ready');
    }
  </script>
  <script src="../js/auth/client.js"></script>
  <script src="../js/auth/storage-prefs.js"></script>
  <script src="../js/auth/redirects.js"></script>
  <script src="../js/auth/errors.js"></script>
  <script src="../js/auth/roles-permissions.js?v=auth-unify-001"></script>
  <script src="../js/auth/api/login.js"></script>
  <script src="../js/auth/api/profiles.js"></script>
  <script src="../js/auth/api/visitantes.js"></script>
  <script src="../js/auth/api/visitor-provisioning.js"></script>
  <script src="../js/auth/api/favoritos.js"></script>
  <script src="../js/auth/api/oauth.js?v=auth-unify-001"></script>
  <script src="../js/auth/visitor-auth.js"></script>
  <script src="../js/visitor-session.js"></script>
  <script src="../admin/js/platform/boxies-app-shell.js?v=shell-001"></script>
  <script src="js/api/projects.js"></script>
  <script src="js/auth-gate.js?v=shell-002"></script>
  <script src="js/views/dashboard.js?v=shell-002"></script>
  <script src="js/views/projects.js?v=shell-002"></script>
  <script src="js/views/users.js?v=shell-002"></script>
  <script src="js/views/templates.js?v=shell-002"></script>
  <script src="js/views/media.js?v=shell-002"></script>
  <script src="js/views/settings.js?v=shell-002"></script>
  <script src="js/app.js?v=shell-002"></script>
</body>
</html>

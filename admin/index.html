<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOXIES | Acceso</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hall/hall.css">
  <link rel="stylesheet" href="css/admin-auth.css">
  <script src="../js/theme-system.js"></script>
  <script src="../js/platform/hall-design-system.js"></script>
  <script>
    try {
      if (typeof HallDesignSystem !== 'undefined') HallDesignSystem.paint({ persist: false });
      else if (typeof ThemeSystem !== 'undefined') ThemeSystem.init();
      document.documentElement.classList.add('theme-ready');
    } catch (e) {
      document.documentElement.classList.add('theme-ready');
    }
  </script>
</head>
<body class="login-page hall-login">
  <div class="hall-login-page" style="width:100%">
    <div class="login-card hall-card">
      <div class="hall-login-brand">BOXIES</div>
      <h2 class="auth-gate-title">Plataforma</h2>
      <p class="auth-view-lead">Elige a dónde quieres entrar. Misma identidad visual en toda BOXIES.</p>
      <div class="auth-oauth-row">
        <a class="outline-btn auth-action-btn" href="login.html">Panel administrativo</a>
        <a class="outline-btn auth-action-btn" href="../admin2/">Dashboard Global</a>
        <a class="outline-btn auth-action-btn" href="../demo1">Showroom</a>
      </div>
    </div>
  </div>
</body>
</html>

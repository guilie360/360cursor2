<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 PREVENTA | Admin</title>
  <link rel="stylesheet" href="css/admin-auth.css">
  <style>
    .admin-entry-shell {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-entry-card {
      width: min(460px, 100%);
      background: var(--admin-panel);
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius-lg);
      padding: 36px;
      text-align: center;
    }
    .admin-entry-card h1 {
      font-size: 30px;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .admin-entry-card p {
      color: var(--admin-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .admin-entry-actions {
      display: grid;
      gap: 12px;
    }
    .admin-entry-actions a {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: var(--admin-radius-md);
      font-weight: 600;
    }
    .admin-entry-actions .primary {
      background: var(--admin-accent);
      color: #fff;
    }
    .admin-entry-actions .secondary {
      border: 1px solid var(--admin-border2);
      color: var(--admin-text);
    }
    .admin-entry-note {
      margin-top: 22px;
      font-size: 13px;
      color: var(--admin-muted);
      line-height: 1.45;
    }
  </style>
</head>
<body class="login-page">
  <div class="admin-entry-shell">
    <div class="admin-entry-card">
      <h1>360 PREVENTA</h1>
      <p>Elige qué quieres abrir. El panel administrativo y el showroom público son aplicaciones distintas.</p>
      <div class="admin-entry-actions">
        <a class="primary" href="login.html">Panel administrativo</a>
        <a class="secondary" href="../demo">Showroom del proyecto</a>
      </div>
      <p class="admin-entry-note">
        El tema oficial del proyecto solo se aplica en el showroom (<code>index.html</code> de la carpeta raíz),
        no en el panel admin.
      </p>
    </div>
  </div>
</body>
</html>

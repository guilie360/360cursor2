<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOXIES | Dashboard Global</title>
  <link rel="stylesheet" href="css/admin-auth.css">
  <link rel="stylesheet" href="css/global-admin.css">
</head>
<body class="dashboard-shell global-admin-shell">

  <div id="globalAdminGate" class="global-admin-gate" hidden>
    <div class="panel-card global-admin-forbidden">
      <h1>403 — Acceso denegado</h1>
      <p>No tienes permisos de administrador para acceder al Dashboard Global de BOXIES.</p>
      <div class="global-admin-forbidden-actions">
        <a class="btn-primary btn-compact" href="login.html">Volver al inicio de sesión</a>
        <button type="button" class="btn-ghost btn-compact" id="globalForbiddenLogoutBtn">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <div id="globalAdminApp" class="global-admin-app" hidden>
    <div class="dashboard-layout global-admin-layout">
      <aside class="dashboard-sidebar global-admin-sidebar">
        <div class="global-admin-brand">BOXIES</div>
        <nav class="sidebar-nav" id="globalSidebarNav" aria-label="Navegación global">
          <button type="button" class="nav-item active" data-global-section="dashboard">Dashboard</button>
          <button type="button" class="nav-item" data-global-section="projects">Proyectos</button>
          <button type="button" class="nav-item" data-global-section="users">Usuarios</button>
          <button type="button" class="nav-item" data-global-section="templates">Plantillas</button>
          <button type="button" class="nav-item" data-global-section="settings">Configuración</button>
        </nav>
        <div class="global-admin-sidebar-foot">
          <div class="user-chip" id="globalUserChip"></div>
          <button type="button" class="btn-ghost global-logout-btn" id="globalLogoutBtn">Cerrar sesión</button>
        </div>
      </aside>
      <main class="dashboard-content" id="globalAdminContent"></main>
    </div>
  </div>

  <div class="content-modal global-admin-modal" id="globalComingSoonModal" aria-hidden="true">
    <div class="content-modal-box global-admin-modal-box">
      <h2 class="global-admin-modal-title">Función en desarrollo</h2>
      <p class="global-admin-modal-copy">
        La creación automática de proyectos será implementada en la siguiente fase.
      </p>
      <div class="global-admin-modal-actions">
        <button type="button" class="btn-primary btn-compact" id="globalComingSoonCloseBtn">Entendido</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/shared/config.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/api/base.js"></script>
  <script src="js/api/profile.js"></script>
  <script src="js/api/proyectos.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/bootstrap.js"></script>
  <script src="js/global/auth-gate.js"></script>
  <script src="js/global/views/dashboard.js"></script>
  <script src="js/global/views/projects.js"></script>
  <script src="js/global/views/users.js"></script>
  <script src="js/global/views/templates.js"></script>
  <script src="js/global/views/settings.js"></script>
  <script src="js/global/app.js"></script>
</body>
</html>

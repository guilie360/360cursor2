<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 PREVENTA | Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hall/hall.css">
  <link rel="stylesheet" href="css/admin-auth.css">
  <script src="../js/theme-system.js"></script>
  <script src="../js/platform/hall-design-system.js"></script>
  <script>
    try {
      if (typeof HallDesignSystem !== 'undefined') HallDesignSystem.paint({ persist: false });
      else if (typeof ThemeSystem !== 'undefined') ThemeSystem.init();
      document.documentElement.classList.add('theme-ready');
    } catch (e) {
      document.documentElement.classList.add('theme-ready');
    }
  </script>
  <style>
    .admin-entry-shell {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-entry-card {
      width: min(460px, 100%);
      background: var(--glass-panel, var(--bg-popup));
      border: 1px solid var(--glass-border, var(--border));
      border-radius: 18px;
      padding: 36px;
      text-align: center;
    }
    .admin-entry-card h1 {
      font-size: 30px;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .admin-entry-card p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .admin-entry-actions {
      display: grid;
      gap: 12px;
    }
    .admin-entry-actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-height: 48px;
      padding: 13px 28px;
      border-radius: var(--menu-card-radius, 14px);
      border: var(--btn-border-width, 2px) solid var(--btn-border, var(--glass-border));
      background: var(--btn-glass-surface, var(--btn-surface));
      color: var(--text-primary);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .admin-entry-note {
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }
  </style>
</head>
<body class="login-page">
  <div class="admin-entry-shell">
    <div class="admin-entry-card">
      <h1>360 PREVENTA</h1>
      <p>Elige qué quieres abrir. El panel administrativo y el showroom público son aplicaciones distintas.</p>
      <div class="admin-entry-actions">
        <a class="primary" href="login.html">Panel administrativo</a>
        <a class="secondary" href="../demo1">Showroom del proyecto</a>
      </div>
      <p class="admin-entry-note">
        El tema oficial del proyecto solo se aplica en el showroom (<code>index.html</code> de la carpeta raíz),
        no en el panel admin.
      </p>
    </div>
  </div>
</body>
</html>

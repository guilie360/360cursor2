<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOXIES | Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hall/hall.css">
  <link rel="stylesheet" href="css/admin-auth.css">
  <script src="../js/theme-system.js"></script>
  <script src="../js/platform/hall-design-system.js"></script>
  <script>
    try {
      if (typeof HallDesignSystem !== 'undefined') HallDesignSystem.paint({ persist: false });
      else if (typeof ThemeSystem !== 'undefined') ThemeSystem.init();
      document.documentElement.classList.add('theme-ready');
    } catch (e) {
      document.documentElement.classList.add('theme-ready');
    }
  </script>
</head>
<body class="login-page hall-login">

  <div class="login-card">
    <div class="hall-login-brand">BOXIES</div>
    <h2 class="auth-gate-title">Panel Administrativo</h2>
    <p class="auth-view-lead">Entra con tu cuenta de administración.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" placeholder="correo@empresa.com" required>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <label class="remember-row">
        <input id="rememberEmail" type="checkbox" checked>
        <span>Recordar mi correo</span>
      </label>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loginBtnText">Iniciar sesión</span>
      </button>
    </form>

    <div class="form-message" id="formMessage" role="alert"></div>

    <div class="forgot-link">
      <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="auth-divider" aria-hidden="true"><span>o</span></div>

    <a class="btn-secondary auth-register-cta" id="visitorRegisterLink" href="../auth/registro.html">Crear cuenta de visitante</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/shared/config.js"></script>
  <script src="../js/shared/constants.js"></script>
  <script src="../js/shared/formatters.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/api/base.js"></script>
  <script src="js/api/profile.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/bootstrap.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

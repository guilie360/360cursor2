  <script>
    (function () {
      function refreshChip() {
        var el = document.getElementById('builderUserChip');
        if (!el || typeof VisitorSession === 'undefined') return;
        var p = VisitorSession.getProfile();
        if (!p) return;
        el.innerHTML = 'Admin · <strong>' + (p.nombre_visible || p.nombre || 'Usuario') + '</strong>';
      }
      if (typeof AuthBootstrap !== 'undefined') {
        AuthBootstrap.whenReady().then(refreshChip);
      }
    })();
  </script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mi perfil · 360Preventa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/scrollbar.css?v=1">
<link rel="stylesheet" href="/shared/css/safe-area.css?v=9">
<link rel="stylesheet" href="/shared/css/site-chrome.css?v=9">
<link rel="stylesheet" href="/shared/css/global-nav.css?v=8">
<link rel="stylesheet" href="/panel_gestion/css/base.css?v=panel75">
<link rel="stylesheet" href="/panel_gestion/css/patches.css?v=panel75">
<link rel="stylesheet" href="/miperfil/miperfil.css?v=14">
</head>
<body class="portal-mode miperfil-mode miperfil-login-open">
<div id="teamChatPopup" class="portal-hidden" role="dialog" aria-modal="false" aria-label="Chat con admin">
 <div class="chat-popup-head"><h3 id="chatPopupTitle">Chat con 360Preventa</h3><div class="chat-popup-actions"><button class="chat-popup-close" id="teamChatPopupClose" type="button" aria-label="Cerrar chat">×</button></div></div>
 <div id="teamChatMessages" class="team-chat-messages" aria-live="polite"></div>
 <form id="teamChatForm" class="team-chat-form"><textarea id="teamChatInput" rows="2" placeholder="Escribe al admin…" required></textarea><button class="btn primary" type="submit">Enviar</button></form>
</div>

<section class="login-screen" id="loginScreen">
 <div class="login-card">
  <button type="button" class="login-home-logo mag" data-href="/" aria-label="Volver a 360Preventa" data-cursor="INICIO">
   <img src="/panel_gestion/assets/logo.png" alt="360Preventa">
  </button>
  <h1 class="login-wordmark">BOXIES</h1>
  <p class="login-subtitle"><strong>360PREVENTA</strong> · MI PERFIL</p>
  <form id="loginForm">
   <div class="login-field">
    <label for="loginEmail">Correo</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
   </div>
   <div class="login-field">
    <label for="loginPassword">Contraseña</label>
    <div class="login-password-wrap">
     <input id="loginPassword" type="password" autocomplete="current-password" required>
     <button type="button" class="login-password-toggle" data-password-toggle="loginPassword" aria-label="Mostrar contraseña"></button>
    </div>
   </div>
   <button class="login-submit mag" type="submit" data-cursor="ENTRAR">Iniciar sesión</button>
   <div class="login-error" id="loginError" aria-live="polite"></div>
  </form>
  <a class="login-back-arrow mag" href="/login/" aria-label="Volver a elegir Cliente o Equipo" data-cursor="VOLVER" title="Volver">
   <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
  </a>
 </div>
</section>

<div class="portal portal-hidden" id="portal">
 <header class="portal-head"><div class="portal-head-inner">
  <div class="portal-brand">
   <img class="portal-brand-logo" id="portalLogo" alt="Logo 360Preventa" src="/panel_gestion/assets/logo.png">
   <span class="portal-brand-copy">360Preventa<small>Mi perfil</small></span>
  </div>
  <div class="portal-head-right">
   <span class="pay-stage-dots miperfil-pay-dots portal-hidden" id="payHeaderDots" title="Estado de pago" aria-label="Estado de pago" aria-hidden="true">
    <i class="pay-stage-dot" data-stage="deposit"></i>
    <i class="pay-stage-dot" data-stage="balance"></i>
   </span>
   <button class="btn miperfil-pay-btn portal-hidden" id="payHeaderBtn" type="button">Pagos</button>
   <button class="btn portal-logout portal-logout-icon" id="logoutBtn" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 16l4-4-4-4M18 12H9"/></svg>
   </button>
  </div>
 </div></header>

 <div class="portal-wrap">
  <div class="miperfil-page-head" id="miperfilPageHead">
   <div class="eyebrow" id="miperfilEyebrow">360PREVENTA · MI PERFIL</div>
   <h1 class="portal-title" id="miperfilTitle">Hola</h1>
   <p class="desc miperfil-lead" id="miperfilLead">Sigue el avance de tu proyecto.</p>
  </div>

  <section id="homeView" class="miperfil-home portal-hidden">
   <div class="portal-grid miperfil-grid">
    <button type="button" class="portal-card portal-card--primary" data-miperfil-page="info">
     <span class="picon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.8-3.2 4.2-4.5 7-4.5S17.2 15.8 19 19"/></svg></span>
     <b>Mi información</b>
     <small>Nombre, correo, teléfono y contraseña.</small>
    </button>
    <button type="button" class="portal-card portal-card--primary" data-miperfil-page="docs">
     <span class="picon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7V3z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
     <b>Mis documentos</b>
     <small>Cotización, contrato e invoice del anticipo.</small>
    </button>
    <button type="button" class="portal-card portal-card--primary" data-miperfil-page="showrooms">
     <span class="picon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg></span>
     <b>Mis showrooms</b>
     <small>Miniaturas y carpeta Drive de tu proyecto.</small>
    </button>
   </div>
  </section>

  <section id="infoView" class="miperfil-page portal-hidden">
   <form id="infoForm" class="miperfil-info-form">
    <div class="field"><label for="infoName">Nombre</label><input id="infoName" type="text" autocomplete="name" required></div>
    <div class="field"><label for="infoEmail">Correo</label><input id="infoEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="infoPhone">Teléfono / contraseña</label><input id="infoPhone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="3001234567"></div>
    <button class="btn primary" type="submit">Guardar</button>
    <p class="desc miperfil-error" id="infoStatus" aria-live="polite"></p>
   </form>
  </section>

  <section id="docsView" class="miperfil-page portal-hidden">
   <div id="docsList" class="docs-list" aria-live="polite"></div>
  </section>

  <section id="paysView" class="miperfil-page portal-hidden">
   <div id="paysList" class="pays-list" aria-live="polite"></div>
  </section>

  <section id="showroomsView" class="miperfil-page portal-hidden">
   <div id="showroomsRoot" class="showrooms-root" aria-live="polite"></div>
  </section>
 </div>

 <footer class="hunter-goal-footer" id="hunterGoalFooter" aria-label="Progreso de tu proyecto">
  <div class="hunter-goal-footer-inner">
   <button class="footer-back portal-hidden mag" id="portalBack" type="button" aria-label="Volver" title="Volver" data-cursor="VOLVER">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
   </button>
   <div class="hunter-goal-meta">
    <span class="goal-caption" id="hunterGoalCaption">Mi perfil · avance</span>
    <div class="hunter-goal-track" id="hunterGoalTrack" style="--goal-step:10%" role="progressbar" aria-label="Avance del proyecto" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><span class="hunter-goal-fill" id="hunterGoalFill"></span><span class="hunter-goal-ticks" aria-hidden="true"></span></div>
    <span class="hunter-goal-bonus" id="hunterGoalBonus"><small>Etapa</small>—</span>
   </div>
   <button id="teamChatFloat" class="footer-chat-btn mag" type="button" aria-label="Abrir chat con admin" title="Chat con admin" data-cursor="CHAT">✉<span id="chatUnreadBadge" class="chat-unread-badge">0</span></button>
  </div>
 </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/shared/config.js"></script>
<script src="/js/auth/storage-prefs.js"></script>
<script src="/js/auth/client.js"></script>
<script src="/js/shared/client-account.js?v=3"></script>
<script src="/js/shared/quote-pdf.js?v=1"></script>
<script src="/shared/js/global-nav.js?v=23"></script>
<script src="/miperfil/client-chat.js?v=4"></script>
<script src="/miperfil/docs.js?v=2"></script>
<script src="/miperfil/payments.js?v=3"></script>
<script src="/miperfil/showrooms.js?v=1"></script>
<script src="/shared/js/password-toggle.js?v=1"></script>
<script src="/miperfil/miperfil.js?v=14"></script>
</body>
</html>

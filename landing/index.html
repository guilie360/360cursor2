<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>360Preventa — Experiencias digitales para comercializar proyectos inmobiliarios</title>
<meta name="description" content="Presenta y comercializa proyectos inmobiliarios antes de que estén terminados mediante una experiencia digital interactiva, accesible y lista para compartir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/scrollbar.css?v=1">
<link rel="stylesheet" href="/shared/css/safe-area.css?v=9">
<link rel="stylesheet" href="/shared/css/site-chrome.css?v=8">
<link rel="stylesheet" href="/shared/css/global-nav.css?v=11">
<link rel="preconnect" href="https://boxies.b-cdn.net" crossorigin>
<link rel="stylesheet" href="/landing/css/landing.css?v=story23">
<link rel="preload" as="image" href="/landing/assets/door-closed-2x.webp" type="image/webp">
</head>
<body>
<div class="page-transit" id="pageTransit" aria-hidden="true">
  <div class="page-transit-mark">
    <img src="/landing/assets/logo.png" alt="" class="page-transit-logo page-transit-logo--ghost">
    <img src="/landing/assets/logo.png" alt="" class="page-transit-logo page-transit-logo--fill">
  </div>
</div>
<header class="topbar">
  <button type="button" class="header-logo" id="headerLogo" aria-label="360Preventa"><img src="/landing/assets/logo.png" alt="360Preventa"></button>
</header>
<button class="fullscreen-toggle mag" id="fullscreenToggle" type="button" aria-label="Activar pantalla completa" title="Pantalla completa" data-cursor="PANTALLA">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
</button>
<main>
<section class="intro" id="inicio">
  <div class="intro-content">
    <img class="intro-logo" src="/landing/assets/logo.png" alt="Logo 360Preventa">
    <h1>360PREVENTA</h1>
    <div class="intro-subtitle">Real estate experience</div>
  </div>
  <div class="scroll-hint">Desliza para descubrir</div>
</section>
<section class="scroll-stage" id="servicio">
  <div class="scroll-stage-inner" id="scrollStage">
    <canvas id="scrollCv" aria-hidden="true"></canvas>
    <img class="scroll-poster" id="scrollPoster" src="/landing/assets/door-closed-2x.webp" alt="" decoding="async" fetchpriority="high" aria-hidden="true">
    <div class="scroll-shade" id="scrollShade"></div>
    <div class="scroll-scrim" id="scrollScrim"></div>
    <div id="scrollMsgs" class="scroll-msgs" aria-live="polite"></div>
    <div class="scroll-hint-story" id="scrollHintStory">Desliza<i></i></div>
    <div class="scroll-dots" id="scrollDots" aria-hidden="true"></div>
    <div class="scroll-stage-loading" aria-hidden="true">Cargando experiencia…</div>
  </div>
</section>
<section class="final" id="demo">
  <div class="final-bg"></div>
  <div class="final-beam" aria-hidden="true"></div>
  <div class="final-content">
    <div class="final-copy">
      <div class="final-eyebrow">EXPLORA LA EXPERIENCIA</div>
      <h2>Una nueva forma de experimentar un inmueble.</h2>
      <p class="final-description">Selecciona un showroom y descubre cómo funciona.</p>
    </div>
    <div class="showroom-side">
      <div class="showrooms" id="demos">
        <!-- Sustituye cada data-url por la dirección real de tu showroom -->
        <button type="button" class="showroom" data-url="DEMO_EXTERIORES_URL" aria-label="Explorar showroom de apartamento">
          <span class="showroom-index">01</span><strong>APARTAMENTO</strong>
        </button>
        <button type="button" class="showroom" data-url="DEMO_INTERIORES_URL" aria-label="Explorar showroom de estudio">
          <span class="showroom-index">02</span><strong>ESTUDIO</strong>
        </button>
        <button type="button" class="showroom" data-url="DEMO_COMPLETO_URL" aria-label="Explorar showroom de coliving">
          <span class="showroom-index">03</span><strong>COLIVING</strong>
        </button>
      </div>
    </div>
  </div>
  <div class="final-footer"><span>360PREVENTA © 2026</span></div>
</section>
<div class="demo-page" id="demoPage" aria-hidden="true">
  <div class="demo-page-inner">
    <div class="demo-page-eyebrow">360PREVENTA · SHOWROOM VIRTUAL</div>
    <h1 id="demoPageTitle">APARTAMENTO</h1>
  </div>
  <div class="demo-page-actions">
    <button class="demo-back" id="demoBack" type="button" aria-label="Volver a los demos" title="Volver a los demos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button type="button" class="demo-explore" id="demoExplore" data-url="#">EXPLORAR</button>
  </div>
</div>
</main>
<script src="/shared/js/fullscreen-persist.js?v=9"></script>
<script src="/shared/js/nav-no-status.js?v=2"></script>
<script src="/shared/js/page-transit.js?v=4"></script>
<script src="/shared/js/global-nav.js?v=27"></script>
<script src="/landing/js/scroll-story.js?v=20"></script>
<script src="/landing/js/landing.js?v=story9"></script>
</body>
</html>

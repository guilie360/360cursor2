<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>360 PREVENTA | Mi espacio</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../admin/css/admin-auth.css">
  <script src="../js/theme-system.js"></script>
  <script>ThemeSystem.init();</script>
</head>
<body class="dashboard-shell visitor-dashboard">

  <header class="dashboard-header">
    <div class="dashboard-logo">360 PREVENTA</div>
    <div class="dashboard-header-actions">
      <div class="user-chip" id="userChip"></div>
      <button type="button" class="btn-ghost btn-compact" id="exploreBtn">Explorar proyectos</button>
      <button type="button" class="btn-ghost btn-compact" id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <main class="visitor-dashboard-main">
    <div id="loadingBlock" class="admin-loading-block">
      <div class="admin-spinner" aria-hidden="true"></div>
      <p>Cargando tu espacio...</p>
    </div>

    <div id="dashboardView" class="visitor-dashboard-view" hidden>
      <div id="dashboardSections" class="visitor-dashboard-sections"></div>
    </div>

    <div id="settingsView" class="visitor-settings-view" hidden>
      <div class="visitor-settings-panel">
        <button type="button" class="btn-ghost btn-compact visitor-settings-back" id="settingsBackBtn">← Volver al inicio</button>
        <div class="section-header">
          <h1>Configuración</h1>
          <p>Edita tu perfil y revisa la información de tu cuenta.</p>
        </div>
        <div id="settingsContent"></div>
      </div>
    </div>

    <div class="form-message visitor-dashboard-message" id="formMessage" role="alert"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/shared/config.js"></script>
  <script src="../js/shared/formatters.js"></script>
  <script src="../js/auth/client.js"></script>
  <script src="../js/auth/redirects.js"></script>
  <script src="../js/auth/storage-prefs.js"></script>
  <script src="../js/auth/errors.js"></script>
  <script src="../js/auth/routes.js"></script>
  <script src="../js/auth/roles-permissions.js"></script>
  <script src="../js/auth/api/login.js"></script>
  <script src="../js/auth/api/profiles.js"></script>
  <script src="../js/auth/api/visitantes.js"></script>
  <script src="../js/auth/api/favoritos.js"></script>
  <script src="../js/auth/visitor-auth.js"></script>
  <script src="../js/visitor-personalization.js"></script>
  <script src="js/auth-page.js"></script>
  <script src="js/dashboard/core.js"></script>
  <script src="js/dashboard/widgets/favorites.js"></script>
  <script src="js/dashboard/widgets/compare.js"></script>
  <script src="js/dashboard/widgets/notifications.js"></script>
  <script src="js/dashboard/widgets/professional.js"></script>
  <script src="js/dashboard/widgets/settings.js"></script>
  <script src="js/cuenta.js"></script>
</body>
</html>

  <script>
    /* Identity debug probe — must exist before any builder click */
    window.__BOXIES_IDENTITY_PROBE__ = 'ws54i2';
    window.__BOXIES_IDENTITY_TRACE__ = [{
      t: Date.now(),
      step: 'boot',
      probe: 'ws54i2',
      href: String(location.href || '')
    }];
    console.log('[IDENTITY] boot probe=ws54i2');
  </script>

  <!-- Login (outside Shell) -->
  <div id="bxLoginView" class="hall-login-page boxies-login" hidden>
    <button type="button" class="boxies-header__fs boxies-login__fs" id="bxLoginFullscreenBtn" aria-label="Pantalla completa" data-tooltip="Pantalla completa" data-fullscreen="enter"></button>
    <div class="content-modal-box auth-experience-box boxies-login__card">
      <div class="hall-login-brand boxies-login__brand" aria-label="BOXIES">B O X I E S</div>
      <p class="boxies-login__subtitle">Administra tu Showroom Digital <span class="boxies-login__brand-mark">360Preventa</span>.</p>

      <div class="auth-oauth-row">
        <button type="button" class="outline-btn auth-oauth-btn" id="bxGoogleBtn">Continuar con Google</button>
      </div>
      <div class="auth-oauth-divider" aria-hidden="true">o</div>

      <form id="bxLoginForm" class="auth-modal-form boxies-login__form" novalidate>
        <label class="auth-field">
          <span>Correo electrónico</span>
          <input id="bxEmail" type="email" autocomplete="email" placeholder="correo@empresa.com" required>
        </label>
        <label class="auth-field">
          <span>Contraseña</span>
          <input id="bxPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="auth-toggle-password boxies-login__eye" id="bxTogglePassword" aria-label="Mostrar contraseña" title="Mostrar" data-icon-toggle="1"></button>
        </label>
        <label class="auth-remember-row">
          <input id="bxRemember" type="checkbox" checked>
          <span>Recordarme</span>
        </label>
        <button type="submit" class="outline-btn auth-action-btn boxies-login__submit" id="bxLoginSubmit">
          <span id="bxLoginSubmitText">Iniciar sesión</span>
        </button>
      </form>

      <div class="auth-modal-message" id="bxLoginMessage" role="alert"></div>
    </div>
  </div>

  <div id="bxForbiddenView" class="hall-login-page" hidden>
    <div class="panel-card" style="width:min(460px,100%);text-align:center">
      <h1 class="panel-card-title">Acceso denegado</h1>
      <p class="placeholder-copy">Tu cuenta está autenticada, pero no tiene rol de administrador en BOXIES.</p>
      <button type="button" class="boxies-action-btn" id="bxForbiddenLogout">Cerrar sesión</button>
    </div>
  </div>
